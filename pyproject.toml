[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "anyone"
version = "1.0.0"
description = "Self-hosted anime and manga aggregator"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
# Fachada de re-export: toda la app importa desde `core.database`, no desde los submódulos.
"core/database.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
