<!-- templates/reader.html -->
{% extends "base.html" %}

{% block title %}Leyendo — {{ content_id }}{% endblock %}

{% block extra_head %}
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<link rel="stylesheet" href="{{ url_for('static', path='css/reader.css') }}">
{% endblock %}

{% block content %}
<div class="reader-root" id="reader-root">

  <div id="media-content">
    <div id="chapter-wrapper" class="visible">
      <div class="loading-spinner"></div>
    </div>
  </div>

  <!-- Back button -->
  <button id="back-to-serie" class="reader-ui">
    <i class="fas fa-arrow-left" style="font-size:11px;"></i> Volver
  </button>

  <!-- Fullscreen toggle -->
  <button id="fullscreen-btn" class="reader-ui" title="Pantalla completa (F)">
    <i class="fas fa-expand"></i>
  </button>

  <!-- Nav controls -->
  <div class="controls-bar reader-ui" id="controls">
    <button class="nav-btn" id="prev-btn" title="Capítulo anterior">
      <i class="fas fa-chevron-left"></i>
    </button>
    <span id="chapter-label">Cap. <strong id="current-chapter-num">—</strong></span>
    <button class="nav-btn" id="next-btn" title="Capítulo siguiente">
      <i class="fas fa-chevron-right"></i>
    </button>
  </div>

</div>
{% endblock %}

{% block extra_scripts %}
<script>
  window.readerData = {
    type:            "{{ type }}",
    source:          "{{ source }}",
    content_id:      "{{ content_id }}",
    current_chapter: "{{ chapter }}"
  };

  const isManga  = window.readerData.type === 'manga';
  const uiEls    = document.querySelectorAll('.reader-ui');
  const controls = document.getElementById('controls');

  // ── Chapter label pop animation ───────────────────────────────────────
  window.animateChapterLabel = function() {
    const lbl = document.getElementById('chapter-label');
    lbl.classList.remove('changed');
    void lbl.offsetWidth; // reflow
    lbl.classList.add('changed');
    setTimeout(() => lbl.classList.remove('changed'), 400);
  };

  // ── Chapter transition helpers (expuestos para reader.js) ─────────────
  window.chapterTransition = function(loadFn) {
    const wrapper = document.getElementById('chapter-wrapper');
    if (!wrapper) return loadFn();

    wrapper.classList.remove('visible');
    wrapper.classList.add('leaving');

    setTimeout(() => {
      wrapper.classList.remove('leaving');
      wrapper.classList.add('entering');
      loadFn();

      requestAnimationFrame(() => requestAnimationFrame(() => {
        wrapper.classList.remove('entering');
        wrapper.classList.add('visible');
        window.animateChapterLabel();
      }));
    }, 200);
  };

  // ── UI visibility ─────────────────────────────────────────────────────
  if (isManga) {
    let uiVisible = false;

    function toggleUI() {
      uiVisible = !uiVisible;
      uiEls.forEach(el => el.classList.toggle('show', uiVisible));
    }

    document.getElementById('media-content').addEventListener('click', e => {
      if (e.target.closest('#prev-btn, #next-btn, #back-to-serie, #fullscreen-btn')) return;
      toggleUI();
    });

    ['prev-btn', 'next-btn', 'back-to-serie', 'fullscreen-btn'].forEach(id => {
      document.getElementById(id)?.addEventListener('click', e => e.stopPropagation());
    });

  } else {
    // Anime: auto-hide on mouse idle
    let hideTimer;
    controls.classList.add('manga-top');

    function showUI() {
      uiEls.forEach(el => el.classList.add('show'));
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        uiEls.forEach(el => el.classList.remove('show'));
      }, 2500);
    }

    document.addEventListener('mousemove', showUI);
    document.addEventListener('touchstart', showUI, { passive: true });
    showUI();
  }

  // ── Fullscreen ────────────────────────────────────────────────────────
  const fullscreenBtn = document.getElementById('fullscreen-btn');
  const rootElement   = document.getElementById('reader-root');

  function updateFullscreenIcon() {
    const icon = fullscreenBtn.querySelector('i');
    icon.className = document.fullscreenElement ? 'fas fa-compress' : 'fas fa-expand';
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      rootElement.requestFullscreen().catch(err =>
        console.warn(`Pantalla completa: ${err.message}`)
      );
    } else {
      document.exitFullscreen();
    }
  }

  fullscreenBtn?.addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', updateFullscreenIcon);
  document.addEventListener('keydown', e => {
    if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFullscreen(); }
  });
</script>
<script src="{{ url_for('static', path='js/reader.js') }}"></script>
{% endblock %}
