<!-- templates/reader.html -->
{% extends "base.html" %}

{% block title %}Leyendo — {{ content_id }}{% endblock %}

{% block extra_head %}
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<link rel="stylesheet" href="{{ url_for('static', path=bundles.get('css_reader', 'css/reader.css')) }}">
{% endblock %}

{% block content %}
<div class="reader-root" id="reader-root">

  <div id="media-content">
    <div id="chapter-wrapper" class="visible">
      <div class="loading-spinner"></div>
    </div>
  </div>

  <!-- Back button -->
  <button id="back-to-serie" class="reader-ui">
    <i class="fas fa-arrow-left"></i> Volver
  </button>

  <!-- Fullscreen toggle -->
  <button id="fullscreen-btn" class="reader-ui" title="Pantalla completa (F)">
    <i class="fas fa-expand"></i>
  </button>

  <!-- Nav controls (manga) -->
  <div class="controls-bar reader-ui" id="controls">
    <button class="nav-btn" id="prev-btn" title="Capítulo anterior">
      <i class="fas fa-chevron-left"></i>
    </button>
    <span id="chapter-label">Cap. <strong id="current-chapter-num">—</strong></span>
    <button class="nav-btn" id="next-btn" title="Capítulo siguiente">
      <i class="fas fa-chevron-right"></i>
    </button>
  </div>

  <!-- ── Player overlay (anime) ── -->
  <div id="player-overlay" class="player-overlay hidden">
    <!-- Top bar -->
    <div class="po-top">
      <button id="po-back" class="po-btn" title="Volver">
        <i class="fas fa-arrow-left"></i>
      </button>
      <div class="po-chapter-info">
        <button id="po-prev" class="po-btn po-btn--sm" title="Capítulo anterior">
          <i class="fas fa-chevron-left"></i>
        </button>
        <span class="po-chapter-label">Cap. <strong id="po-chapter-num">—</strong></span>
        <button id="po-next" class="po-btn po-btn--sm" title="Capítulo siguiente">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>
      <button id="po-fs" class="po-btn" title="Pantalla completa (F)">
        <i class="fas fa-expand"></i>
      </button>
    </div>

    <!-- Center play button -->
    <button id="po-center-play" class="po-center-play hidden">
      <svg id="po-center-svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="6 3 20 12 6 21 6 3"/>
      </svg>
    </button>

    <!-- Bottom bar -->
    <div class="po-bottom">
      <div class="po-progress-wrap">
        <div class="po-progress-track">
          <div class="po-progress-played" id="po-progress-played"></div>
        </div>
        <div class="po-progress-tooltip" id="po-progress-tooltip">0:00</div>
        <input type="range" id="po-progress" class="po-progress" value="0" min="0" max="1000" step="1">
      </div>
      <div class="po-bar">
        <div class="po-bar-left">
          <button id="po-play" class="po-btn po-btn--play" title="Reproducir/Pausar">
            <svg id="po-play-svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="6 3 20 12 6 21 6 3"/>
            </svg>
          </button>
          <span id="po-time" class="po-time">0:00 / 0:00</span>
        </div>
        <div class="po-bar-right">
          <button id="po-subs" class="po-btn po-btn--subs" title="Subtítulos (C)">CC</button>
          <button id="po-speed" class="po-btn po-btn--speed" title="Velocidad">1×</button>
          <div class="po-vol-wrap">
            <button id="po-vol" class="po-btn" title="Volumen">
              <svg id="po-vol-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              </svg>
            </button>
            <input type="range" id="po-vol-slider" class="po-vol-slider" value="1" min="0" max="1" step="0.01">
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
{% endblock %}

{% block extra_scripts %}
<script>
  window.readerData = {
    type:            "{{ type }}",
    source:          "{{ source }}",
    content_id:      "{{ content_id }}",
    current_chapter: "{{ chapter }}"
  };

  const isManga  = window.readerData.type === 'manga';
  const uiEls    = document.querySelectorAll('.reader-ui');
  const controls = document.getElementById('controls');

  // ── Chapter label pop animation ───────────────────────────────────────
  window.animateChapterLabel = function() {
    const lbl = document.getElementById('chapter-label');
    lbl.classList.remove('changed');
    void lbl.offsetWidth; // reflow
    lbl.classList.add('changed');
    setTimeout(() => lbl.classList.remove('changed'), 400);
  };

  // ── Chapter transition helpers (expuestos para reader.js) ─────────────
  window.chapterTransition = function(loadFn) {
    const wrapper = document.getElementById('chapter-wrapper');
    if (!wrapper) return loadFn();

    wrapper.classList.remove('visible');
    wrapper.classList.add('leaving');

    setTimeout(() => {
      wrapper.classList.remove('leaving');
      wrapper.classList.add('entering');
      loadFn();

      requestAnimationFrame(() => requestAnimationFrame(() => {
        wrapper.classList.remove('entering');
        wrapper.classList.add('visible');
        window.animateChapterLabel();
      }));
    }, 200);
  };

  // ── Fullscreen ────────────────────────────────────────────────────────
  function getFullscreenTarget() {
    // Anime → reader-root incluye el overlay de controles
    if (!isManga) return document.getElementById('reader-root');
    return document.getElementById('media-content')
        || document.getElementById('reader-root');
  }

  function updateFullscreenIcon() {
    const icons = document.querySelectorAll('#fullscreen-btn i, #po-fs i');
    const cls = document.fullscreenElement ? 'fas fa-compress' : 'fas fa-expand';
    icons.forEach(i => i.className = cls);
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      const target = getFullscreenTarget();
      target.requestFullscreen().catch(err =>
        console.warn(`Pantalla completa: ${err.message}`)
      );
    } else {
      document.exitFullscreen();
    }
  }

  // ── UI visibility ─────────────────────────────────────────────────────
  if (isManga) {
    let uiVisible = false;

    function toggleUI() {
      uiVisible = !uiVisible;
      uiEls.forEach(el => el.classList.toggle('show', uiVisible));
    }

    document.getElementById('media-content').addEventListener('click', e => {
      if (e.target.closest('#prev-btn, #next-btn, #back-to-serie, #fullscreen-btn')) return;
      toggleUI();
    });

    ['prev-btn', 'next-btn', 'back-to-serie', 'fullscreen-btn'].forEach(id => {
      document.getElementById(id)?.addEventListener('click', e => e.stopPropagation());
    });

  } else {
    // Anime: show player overlay, hide manga UI
    document.getElementById('player-overlay')?.classList.remove('hidden');
    uiEls.forEach(el => el.classList.add('hidden'));

    // Auto-hide on mouse idle
    let hideTimer;

    const readerRoot = document.getElementById('reader-root');

    function showPlayerUI() {
      const po = document.getElementById('player-overlay');
      if (!po) return;
      po.classList.remove('po-hidden');
      readerRoot?.classList.remove('cursor-hidden');
      clearTimeout(hideTimer);
      const video = document.getElementById('anime-video');
      hideTimer = setTimeout(() => {
        if (!video || !video.paused) {
          po.classList.add('po-hidden');
          readerRoot?.classList.add('cursor-hidden');
        }
      }, 3000);
    }

    document.addEventListener('mousemove', showPlayerUI);
    document.addEventListener('touchstart', showPlayerUI, { passive: true });
    showPlayerUI();

    document.getElementById('media-content')?.addEventListener('click', () => {
      const video = document.getElementById('anime-video');
      if (!video) return;
      if (video.paused) video.play(); else video.pause();
    });
  }

  // ── Common handlers ───────────────────────────────────────────────────
  document.getElementById('fullscreen-btn')?.addEventListener('click', toggleFullscreen);
  document.getElementById('po-fs')?.addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', updateFullscreenIcon);
  document.addEventListener('keydown', e => {
    if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFullscreen(); }
  });
</script>
<script src="{{ url_for('static', path=bundles.get('js_reader', 'js/reader.js')) }}"></script>
{% endblock %}
