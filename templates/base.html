<!--templates/base.html-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>{% block title %}Comic Web — Anime & Manga{% endblock %}</title>

  <link rel="icon" href="/static/favicon.ico">

  {% if bundles %}
  <link rel="preload" href="/static/fonts/Inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/webfonts/fa-solid-900-subset.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', path=bundles.get('css_shared', 'css/base.css')) }}">
  {% else %}
  <link rel="stylesheet" href="{{ url_for('static', path='css/inter.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/fa-subset.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/layout.css') }}">
  {% endif %}
  <link rel="stylesheet" href="{{ url_for('static', path='css/queue-indicator.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/scraper-health.css') }}">

  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}

  <script src="{{ url_for('static', path='js/api.js') }}"></script>
  {% if not bundles %}
  <script src="{{ url_for('static', path='js/base.js') }}" defer></script>
  <script src="{{ url_for('static', path='js/toast.js') }}" defer></script>
  <script src="{{ url_for('static', path='js/confirm.js') }}" defer></script>
  <script src="{{ url_for('static', path='js/queue-indicator.js') }}" defer></script>
  <script src="{{ url_for('static', path='js/scraper-health.js') }}" defer></script>
  <script src="{{ url_for('static', path='js/notifications.js') }}" defer></script>
  {% endif %}
  {% block extra_scripts %}{% endblock %}
</body>
</html>
