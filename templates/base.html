<!--templates/base.html-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>{% block title %}Comic Web — Anime & Manga{% endblock %}</title>

  <link rel="icon" href="/static/favicon.ico">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <!-- Design system -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">

  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}

  <script src="{{ url_for('static', filename='js/queue-indicator.js') }}" defer></script>
  {% block extra_scripts %}{% endblock %}

  <script>
    /* ── Body ready (fade-in) ── */
    document.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(() => document.body.classList.add('ready'));
    });

    /* ── Modal helpers (globales) ── */
    window.openModal = function() {
      const m = document.getElementById('modal');
      if (!m) return;
      m.classList.remove('hidden');
      requestAnimationFrame(() => requestAnimationFrame(() => m.classList.add('open')));
    };
    window.closeModal = function() {
      const m = document.getElementById('modal');
      if (!m) return;
      m.classList.remove('open');
      setTimeout(() => m.classList.add('hidden'), 250);
    };

    /* ── Animate cards with IntersectionObserver ── */
    window.animateCards = function(containerSelector, itemSelector) {
      const container = document.querySelector(containerSelector);
      if (!container) return;
      const items = container.querySelectorAll(itemSelector || '.media-card-wrapper, .chapter-pill');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.04 });
      items.forEach((el, i) => {
        el.style.transitionDelay = `${Math.min(i * 30, 380)}ms`;
        observer.observe(el);
      });
    };
  </script>
</body>
</html>
