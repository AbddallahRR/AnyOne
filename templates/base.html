<!--templates/base.html-->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>{% block title %}Comic Web — Anime & Manga{% endblock %}</title>

  <link rel="icon" href="/static/favicon.ico">

  {% if bundles %}
  <link rel="preload" href="/static/fonts/Inter-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/webfonts/fa-solid-900-subset.woff2" as="font" type="font/woff2" crossorigin>
  {% else %}
  <link rel="stylesheet" href="{{ url_for('static', path='css/inter.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/fontawesome.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/layout.css') }}">
  {% endif %}

  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}

  {% if not bundles %}
  <script src="{{ url_for('static', path='js/queue-indicator.js') }}" defer></script>
  {% endif %}
  {% block extra_scripts %}{% endblock %}

  <script>
    /* ── Body ready (fade-in) ── */
    document.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(() => document.body.classList.add('ready'));
    });

    /* ── Modal helpers (globales) ── */
    window.openModal = function() {
      const m = document.getElementById('modal');
      if (!m) return;
      m.classList.remove('hidden');
      requestAnimationFrame(() => requestAnimationFrame(() => m.classList.add('open')));
    };
    window.closeModal = function() {
      const m = document.getElementById('modal');
      if (!m) return;
      m.classList.remove('open');
      setTimeout(() => m.classList.add('hidden'), 250);
    };

    /* ── Animate cards with IntersectionObserver ── */
    window.animateCards = function(containerSelector, itemSelector) {
      const container = document.querySelector(containerSelector);
      if (!container) return;
      const items = container.querySelectorAll(itemSelector || '.media-card-wrapper, .chapter-pill');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.04 });
      items.forEach((el, i) => {
        el.style.transitionDelay = `${Math.min(i * 30, 380)}ms`;
        observer.observe(el);
      });
    };
  </script>
</body>
</html>
