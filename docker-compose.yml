services:
  anyone:
    build: .
    container_name: anyone
    ports:
      - "5000:5000"
    volumes:
      - ~/DescargasComics:/data/descargas
      - ~/.config/comic_web:/data/config
      - ~/.config/comic_web/cache:/app/cache
    environment:
      - BASE_DOWNLOAD_DIR=/data/descargas
      - DB_DIR=/data/config
      - DEBUG=false
    restart: unless-stopped
