services:
  anyone:
    build: .
    container_name: comic-web
    ports:
      - "5000:5000"
    volumes:
      - ~/DescargasComics:/data/descargas
      - ~/.config/comic_web:/data/config
      - ~/.config/comic_web/cache:/app/cache
    environment:
      - BASE_DOWNLOAD_DIR=/data/descargas
      - DB_DIR=/data/config
      - DEBUG=false
      - TZ=${TZ:-America/Mexico_City}
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.5'
